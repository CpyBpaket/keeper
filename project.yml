name: Keeper
options:
  bundleIdPrefix: com.keeper
  deploymentTarget:
    iOS: "13.0"
settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1,2"
  IPHONEOS_DEPLOYMENT_TARGET: "13.0"
  CODE_SIGN_STYLE: Manual
targets:
  Keeper:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources/Assets.xcassets
      - www
    settings:
      PRODUCT_NAME: Keeper
      PRODUCT_BUNDLE_IDENTIFIER: com.keeper.demo
      INFOPLIST_FILE: Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
