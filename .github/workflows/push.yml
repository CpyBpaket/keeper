name: Keeper Push

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Отправить сейчас, ignoring schedule'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-push
        run: npm install --no-save --no-audit --no-fund web-push@4

      - name: Send notification
        env:
          VAPID_PUBLIC: ${{ vars.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ vars.VAPID_PRIVATE }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          FORCE: ${{ inputs.force }}
        run: node scripts/send-push.mjs
